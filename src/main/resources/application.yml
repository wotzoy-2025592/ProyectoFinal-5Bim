spring:
  application:
    name: Evaluacion
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/biblioteca}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  error:
    include-stacktrace: never

jwt:
  secret: ${JWT_SECRET}            # mínimo 32 caracteres (256 bits)
  expiration: ${JWT_EXPIRATION:3600000}   # milisegundos (1 hora por defecto)
